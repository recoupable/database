name: Retained evidence manifest transactions
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  evidence-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: [15, 16]
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y -v ${{ matrix.postgres }}
      - name: Test isolated evidence discovery
        run: |
          export PATH="/usr/lib/postgresql/${{ matrix.postgres }}/bin:$PATH"
          python3 -m unittest discover -s tests -p 'test_evidence_manifest*.py'
