name: Retained stream binding proposal (offline only)
on:
  pull_request:
    branches: [main]
    paths:
      - "proposals/stream-evidence-binding-2207/**"
      - "proposals/stream-retention-writer-2207/**"
      - "proposals/retained-field-integration-2207/**"
      - "tests/test_release_cases.py"
      - "supabase/migrations/**"
      - ".github/workflows/stream-binding-proposal.yml"
permissions:
  contents: read
jobs:
  disposable-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: [15, 17]
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          persist-credentials: false
      - name: Install PostgreSQL
        timeout-minutes: 12
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-${{ matrix.postgres }}
      - name: Qualify retained evidence joins and locks
        timeout-minutes: 3
        run: |
          export PATH="/usr/lib/postgresql/${{ matrix.postgres }}/bin:$PATH"
          python3 proposals/stream-retention-writer-2207/test_writer.py
      - uses: actions/checkout@v4
        with:
          repository: recoupable/api
          ref: 6ba799dbb67be284adcd6f8bcd8fcde2faa6c2b8
          path: .worktrees/api/catalog-integration
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned evaluator dependencies
        timeout-minutes: 4
        working-directory: .worktrees/api/catalog-integration
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Qualify actual retention through field computation
        timeout-minutes: 3
        env:
          CATALOG_API_SOURCE: ${{ github.workspace }}/.worktrees/api/catalog-integration
        run: |
          export PATH="/usr/lib/postgresql/${{ matrix.postgres }}/bin:$PATH"
          python3 proposals/retained-field-integration-2207/test_integration.py
