name: Retained stream binding proposal (offline only)
on:
  pull_request:
    branches: [main]
    paths:
      - "proposals/stream-evidence-binding-2207/**"
      - "tests/test_release_cases.py"
      - "supabase/migrations/**"
      - ".github/workflows/stream-binding-proposal.yml"
permissions:
  contents: read
jobs:
  disposable-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: [15, 17]
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
      - name: Install PostgreSQL
        timeout-minutes: 12
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-${{ matrix.postgres }}
      - name: Qualify retained evidence joins and locks
        timeout-minutes: 3
        run: |
          export PATH="/usr/lib/postgresql/${{ matrix.postgres }}/bin:$PATH"
          python3 proposals/stream-evidence-binding-2207/test_binding.py
