name: Release pack transactions
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-packs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - name: Verify private jobs, budgets and recovery
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          python3 -m unittest discover -s tests -p 'test_release_pack_jobs.py'
